spring.application.name=job-portal

# Port
server.port=${PORT:8089}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSON
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Admin
app.admin.email=${HIRE_FLOW_ADMIN_EMAIL:admin@hireflow.com}
app.admin.password=${HIRE_FLOW_ADMIN_PASSWORD:Admin@123}